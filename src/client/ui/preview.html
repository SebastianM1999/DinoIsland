<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>HUD Preview</title>
  <link rel="stylesheet" href="../../../css/main.css">
  <style>
    body {
      background:
        radial-gradient(ellipse at 70% 30%, rgba(255, 255, 255, 0.35), transparent 50%),
        linear-gradient(180deg, #5bb6ee 0%, #9dd9f2 48%, #f1d596 52%, #8fcf5a 70%, #4f9c3c 100%);
    }
    #preview-ctl {
      position: fixed; right: 8px; bottom: 8px; z-index: 100;
      display: flex; gap: 4px; flex-wrap: wrap; max-width: 60vw; justify-content: flex-end;
      font: 12px system-ui; opacity: 0.35;
    }
    #preview-ctl:hover { opacity: 1; }
    #preview-ctl button { font: inherit; padding: 2px 6px; }
  </style>
</head>
<body>
  <div id="hud" hidden></div>
  <div id="preview-ctl" aria-label="Preview controls">
    <button data-a="inv">Tab inventory</button>
    <button data-a="map">M map</button>
    <button data-a="death">Death</button>
    <button data-a="win">Win</button>
    <button data-a="hit">Hit</button>
    <button data-a="weak">Weak hit</button>
    <button data-a="dmg">Damage</button>
    <button data-a="toast">Toast</button>
    <button data-a="eat">Eat</button>
  </div>
  <script>
    document.body.insertAdjacentHTML('beforeend', `
    <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false">
      <filter id="brush-edge" x="-5%" y="-10%" width="110%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.035 0.09" numOctaves="2" seed="4" result="noise"/>
        <feDisplacementMap in="SourceGraphic" in2="noise" scale="7" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>`);
  </script>
  <script type="module" src="./preview.js"></script>
</body>
</html>
