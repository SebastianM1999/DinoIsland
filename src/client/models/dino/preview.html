<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Dino Preview</title>
  <script type="importmap">
    { "imports": { "three": "/vendor/three/build/three.module.js", "three/addons/": "/vendor/three/examples/jsm/" } }
  </script>
  <style>
    :root { color-scheme: light; }
    body { margin: 0; overflow: hidden; background: #8fd0ef; font: 14px system-ui, sans-serif; }
    canvas { display: block; }
    #ui { position: fixed; z-index: 10; left: 8px; top: 8px; display: flex; flex-wrap: wrap; gap: 4px; max-width: min(900px, calc(100vw - 16px)); }
    #species { display: flex; flex-wrap: wrap; gap: 4px; width: 100%; }
    #ui button, #ui select, #ui label { font: inherit; padding: 4px 8px; border-radius: 6px; border: 0; background: #1f2a44; color: #fff; }
    #ui button[aria-pressed="true"] { background: #e8a21c; color: #1f2a44; }
    #info { position: fixed; left: 8px; bottom: 8px; color: #1f2a44; background: #fff8; padding: 4px 8px; border-radius: 6px; }
  </style>
</head>
<body>
  <!-- Dev tool: preview.html?type=raptor&state=walk&view=side
       Renders one species on a flat ground with the shared animator. -->
  <div id="ui"></div>
  <div id="info"></div>
  <div id="perf" style="position:fixed;right:8px;bottom:40px;background:#fff8;padding:4px 8px;color:#1f2a44"></div>
  <script type="module">
    import * as THREE from 'three';
    import { SPECIES } from '../../entities/dinoViews.js';
    import { preloadDinoModels, registerDinoGLTF, buildGLBDino } from './glbDino.js';
    import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
    import { SARCO_TYPE, SARCO_MODEL } from './sarcoModel.js';

    const previewSpecies = { ...SPECIES, [SARCO_TYPE]: {
      build: () => buildGLBDino(SARCO_TYPE), anim: { walkSpeed: 3, runSpeed: 8.5 },
      createAnimator: rig => rig.createAnimator(),
    } };
    let sarcoLoad;
    async function loadReviewModel(nextType) {
      if (nextType !== SARCO_TYPE || buildGLBDino(SARCO_TYPE)) return;
      if (!sarcoLoad) sarcoLoad = (async () => {
        const gltf = await new GLTFLoader().loadAsync(SARCO_MODEL.url);
        registerDinoGLTF(SARCO_TYPE, gltf, SARCO_MODEL);
      })().catch(error => { sarcoLoad = null; throw error; });
      await sarcoLoad;
    }

    const qs = new URLSearchParams(location.search);
    let type = previewSpecies[qs.get('type')] ? qs.get('type') : 'brachio';
    document.getElementById('info').textContent = 'Loading dinosaur models…';
    await preloadDinoModels();
    try { await loadReviewModel(type); }
    catch (error) {
      document.getElementById('info').textContent = `Alpha Sarcosuchus could not load: ${error.message}`;
      throw error;
    }
    let species = previewSpecies[type];
    let build = species.build;
    let ANIM = species.anim;
    let extra = species.extraUpdate;

    const renderer = new THREE.WebGLRenderer({ antialias: true });
    renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
    renderer.setSize(innerWidth, innerHeight);
    renderer.outputColorSpace = THREE.SRGBColorSpace;
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.shadowMap.enabled = true;
    renderer.shadowMap.type = THREE.PCFSoftShadowMap;
    document.body.appendChild(renderer.domElement);
    const scene = new THREE.Scene();
    scene.background = new THREE.Color('#8fd0ef');
    const sun = new THREE.DirectionalLight('#fff0d6', 2.6);
    sun.position.set(-20, 40, 25);
    sun.castShadow = true;
    Object.assign(sun.shadow.camera, { left: -20, right: 20, top: 20, bottom: -20 });
    sun.shadow.mapSize.set(2048, 2048);
    scene.add(sun, new THREE.HemisphereLight('#bfe6ff', '#d8bb80', 1.6));
    const ground = new THREE.Mesh(new THREE.PlaneGeometry(200, 200).rotateX(-Math.PI / 2), new THREE.MeshStandardMaterial({ color: '#86c650', roughness: 1 }));
    ground.receiveShadow = true;
    scene.add(ground);
    // player-sized reference figure (1.8 m)
    const ref = new THREE.Mesh(new THREE.CylinderGeometry(0.35, 0.35, 1.8, 10), new THREE.MeshStandardMaterial({ color: '#57c24f' }));
    ref.position.set(-3, 0.9, 2);
    ref.castShadow = true;
    scene.add(ref);

    let rig = build();
    scene.add(rig.root);
    let anim = species.createAnimator(rig);
    // ?count=20 provides a repeatable skin/mixer/render performance scene.
    const count = Math.min(20, Math.max(1, Number(qs.get('count')) || 1));
    const copies = [];
    function addCopies() {
      for (let i = 1; i < count; i++) {
        const copy = build();
        copy.root.position.set((i % 5 - 2) * 4, 0, (Math.floor(i / 5) + 1) * 5);
        scene.add(copy.root);
        copies.push({ rig: copy, anim: species.createAnimator(copy), st: 0, spd: 0, pos: copy.root.position });
      }
    }
    addCopies();
    const box = new THREE.Box3().setFromObject(rig.root, true);   // precise: skinned vertices, not culling bounds
    const size = box.getSize(new THREE.Vector3());
    const camera = new THREE.PerspectiveCamera(45, innerWidth / innerHeight, 0.1, 500);
    const zoom = parseFloat(qs.get('zoom') || '1');
    const focus = qs.get('focus') || 'body';   // body | head
    const cameraRadius = () => (focus === 'head' ? Math.max(size.x, size.y, size.z) * 0.5 + 1 : Math.max(size.x, size.y, size.z) * 1.6 + 2) / zoom
      * Math.max(1, .8 / camera.aspect);
    let R = cameraRadius();
    const _fp = new THREE.Vector3();

    const STATES = ['idle', 'walk', 'run', 'attack', 'roar', 'graze', 'alert', 'charge', 'tail', 'trapped', 'dead', 'fall', 'fly', 'dive', 'landed', 'swim', 'tail-sweep', 'bite', 'shove', 'pivot', 'retreat', 'ambush', 'recovery'];
    let state = qs.get('state') || 'walk';
    let view = qs.get('view') || 'side';
    let orbit = qs.get('orbit') === '1';
    const ui = document.getElementById('ui');
    const speciesRow = document.createElement('div');
    speciesRow.id = 'species';
    speciesRow.setAttribute('role', 'group');
    speciesRow.setAttribute('aria-label', 'Dinosaur species');
    const speciesButtons = {};
    const speciesNames = { brachio: 'Brachio', stego: 'Stego', raptor: 'Raptor', 'gloom-raptor': 'Gloom Raptor', 'sump-lurker': 'Sump Lurker', 'crystal-plodder': 'Crystal Plodder', ptera: 'Ptera', trex: 'T-Rex', [SARCO_TYPE]: 'Alpha Sarcosuchus' };
    for (const name of Object.keys(previewSpecies)) {
      const button = document.createElement('button');
      button.textContent = speciesNames[name];
      button.setAttribute('aria-pressed', name === type);
      button.onclick = () => switchSpecies(name);
      speciesButtons[name] = button;
      speciesRow.appendChild(button);
    }
    ui.appendChild(speciesRow);
    const btns = {};
    for (const s of STATES) {
      const b = document.createElement('button');
      b.textContent = s;
      b.onclick = () => { state = s; t = 0; for (const k in btns) btns[k].setAttribute('aria-pressed', k === state); syncURL(); };
      b.setAttribute('aria-pressed', s === state);
      btns[s] = b;
      ui.appendChild(b);
    }
    for (const v of ['side', 'front', 'back', 'top', 'three-quarter']) {
      const b = document.createElement('button');
      b.textContent = `view: ${v}`;
      b.onclick = () => { view = v; syncURL(); };
      ui.appendChild(b);
    }
    const ob = document.createElement('button');
    ob.textContent = 'orbit';
    ob.onclick = () => { orbit = !orbit; syncURL(); };
    ui.appendChild(ob);
    let paused = false;
    const pauseButton = document.createElement('button');
    pauseButton.textContent = 'pause';
    pauseButton.onclick = () => { paused = !paused; pauseButton.textContent = paused ? 'resume' : 'pause'; };
    ui.appendChild(pauseButton);
    function updateInfo() {
      document.getElementById('info').textContent = `${speciesNames[type]} (${rig.isGLB ? 'GLB' : 'procedural'}): ${size.x.toFixed(1)} × ${size.y.toFixed(1)} × ${size.z.toFixed(1)} m (W×H×L), ${countTris(rig.root)} tris, ${countMeshes(rig.root)} meshes`;
    }
    updateInfo();

    function countTris(o) { let n = 0; o.traverse((m) => { if (m.isMesh) n += (m.geometry.index ? m.geometry.index.count : m.geometry.attributes.position.count) / 3; }); return Math.round(n); }
    function countMeshes(o) { let n = 0; o.traverse((m) => { if (m.isMesh) n++; }); return n; }

    const previewSpeeds = () => ({ idle: 0, walk: ANIM.walkSpeed ?? 2, run: ANIM.runSpeed ?? 6, charge: ANIM.runSpeed ?? 6, fly: 11, dive: 20, landed: 0 });
    let speeds = previewSpeeds();
    const clock = new THREE.Clock();
    let t = 0;
    const frameSamples = [];
    const updateSamples = [];
    let fakeView = { rig, anim, st: 0, spd: 0, pos: rig.root.position, yaw: 0, time: 0 };
    function syncURL() {
      qs.set('type', type); qs.set('state', state); qs.set('view', view); qs.set('orbit', orbit ? '1' : '0');
      history.replaceState(null, '', `${location.pathname}?${qs}`);
    }
    async function switchSpecies(nextType) {
      if (nextType === type) return;
      try { await loadReviewModel(nextType); }
      catch (error) {
        document.getElementById('info').textContent = `Alpha Sarcosuchus could not load: ${error.message}`;
        return;
      }
      for (const old of [{ rig, anim }, ...copies]) {
        scene.remove(old.rig.root);
        old.anim.dispose?.(); old.rig.dispose?.();
      }
      copies.length = 0;
      type = nextType; species = previewSpecies[type];
      build = species.build; ANIM = species.anim; extra = species.extraUpdate;
      rig = build(); anim = species.createAnimator(rig);
      scene.add(rig.root); addCopies();
      box.setFromObject(rig.root, true).getSize(size);
      R = cameraRadius(); speeds = previewSpeeds();
      fakeView = { rig, anim, st: 0, spd: 0, pos: rig.root.position, yaw: 0, time: 0 };
      t = 0; frameSamples.length = 0; updateSamples.length = 0;
      document.getElementById('perf').textContent = '';
      for (const [name, button] of Object.entries(speciesButtons)) button.setAttribute('aria-pressed', name === type);
      updateInfo(); syncURL();
    }
    const DSMAP = { idle: 0, walk: 1, run: 2, alert: 4, attack: 5, charge: 6, tail: 7, trapped: 9, dead: 10, fall: 10, fly: 11, dive: 12, landed: 13, roar: 14, graze: 15 };
    // Preview extra authored clips without assigning them gameplay states.
    function updatePreviewAnimator(actor, input, dt) {
      const key = state === 'tail-sweep' ? 'tailsweep' : ['swim', 'bite', 'shove', 'pivot', 'retreat', 'ambush', 'recovery'].includes(state) ? state : null;
      const direct = key && actor.actions?.[key];
      if (direct) {
        if (actor.previewClip !== key) {
          for (const [bone, base] of actor.bases) { bone.quaternion.copy(base.q); bone.position.copy(base.p); }
          actor.bases.clear(); actor.mixer.stopAllAction();
          actor.state = null; actor.previewClip = key;
          direct.setLoop(THREE.LoopRepeat, Infinity); direct.clampWhenFinished = false;
          direct.reset().setEffectiveWeight(1).setEffectiveTimeScale(1).play();
        }
        actor.mixer.update(dt);
      } else {
        if (actor.previewClip) {
          const previous = actor.actions[actor.previewClip];
          if (actor.previewClip !== 'swim') { previous.setLoop(THREE.LoopOnce, 1); previous.clampWhenFinished = true; }
          actor.mixer.stopAllAction(); actor.previewClip = null; actor.state = null;
        }
        actor.update(dt, input);
      }
    }
    function loop() {
      requestAnimationFrame(loop);
      const rawDelta = clock.getDelta();
      const dt = paused ? 0 : Math.min(rawDelta, 0.05);
      const frameStart = performance.now();
      t += dt;
      const speed = speeds[state] ?? 0;
      const pose = {};
      if (state === 'attack') { pose.attack = (t % 1.2) < 0.45 ? 1 : 0; pose.jaw = pose.attack; }
      if (state === 'roar') { pose.roar = 1; pose.jaw = 1; }
      if (state === 'graze') pose.headDown = 1;
      if (state === 'alert') { pose.alert = 1; pose.neckRaise = 1; }
      if (state === 'charge') pose.charge = 1;
      if (state === 'tail') pose.tailSwing = (t % 1.6) < 0.6 ? 1 : 0;
      if (state === 'trapped') pose.jaw = 0.6;
      // flyers: fly/dive are airborne; 'fall' = killed in the air, drops for 2 s, then the impact
      if (state === 'dive') pose.dive = 1;
      const airborne = state === 'fly' || state === 'dive' || (state === 'fall' && (t % 4) < 2);
      if (state === 'fall') rig.root.position.y = airborne ? 3 * (1 - ((t % 4) / 2) ** 2) : 0;
      else if (rig.root.position.y) rig.root.position.y = 0;
      updatePreviewAnimator(anim, { speed, dist: speed * dt, yawRate: 0, dead: state === 'dead' || state === 'fall', trapped: state === 'trapped', groundAt: () => 0, groundPitch: 0, pose, airborne }, dt);
      fakeView.st = DSMAP[state] ?? 0;
      fakeView.spd = speed;
      fakeView.time = t;
      extra?.(fakeView, dt);
      for (const copy of copies) {
        updatePreviewAnimator(copy.anim, { speed, dist: speed * dt, yawRate: 0, dead: state === 'dead' || state === 'fall', trapped: state === 'trapped', groundAt: () => 0, groundPitch: 0, pose, airborne }, dt);
        copy.st = fakeView.st; copy.spd = speed;
        extra?.(copy, dt);
      }
      updateSamples.push(performance.now() - frameStart);
      frameSamples.push(rawDelta * 1000);
      if (frameSamples.length > 180) { frameSamples.shift(); updateSamples.shift(); }
      const a = orbit ? t * 0.4 : { side: Math.PI / 2, front: 0, back: Math.PI, top: 0.001, 'three-quarter': Math.PI / 4 }[view];
      const cy = view === 'top' ? R : size.y * 0.55;
      if (focus === 'head' && rig.head) {
        rig.head.getWorldPosition(_fp);
        camera.position.set(_fp.x + Math.sin(a) * R, _fp.y + (view === 'top' ? R : R * 0.25), _fp.z - Math.cos(a) * R);
      } else {
        _fp.set(0, size.y * 0.45, 0);
        camera.position.set(Math.sin(a) * R, cy + (view === 'top' ? 0 : size.y * 0.15), -Math.cos(a) * R);
      }
      camera.lookAt(_fp);
      renderer.render(scene, camera);
      if (frameSamples.length % 30 === 0) {
        const avg = values => values.reduce((a, b) => a + b, 0) / values.length;
        document.getElementById('perf').textContent = `${rig.isGLB ? 'GLB' : 'Procedural'} · ${count} dinos · frame ${avg(frameSamples).toFixed(1)} ms · animation ${avg(updateSamples).toFixed(2)} ms · ${renderer.info.render.triangles.toLocaleString()} rendered tris`;
      }
    }
    // Preview-only inspection hook for clip/bone QA, never used by the game.
    window.dinoPreview = { get rig() { return rig; }, get anim() { return anim; }, get state() { return state; } };
    loop();
    addEventListener('resize', () => { renderer.setSize(innerWidth, innerHeight); camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix(); R = cameraRadius(); });
  </script>
</body>
</html>
