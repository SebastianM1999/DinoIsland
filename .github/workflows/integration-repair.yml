name: Integration repair

on:
  workflow_dispatch:
    inputs:
      pr_number:
        description: Same-repository pull request to repair
        required: true
      expected_head_sha:
        description: Revision reserved by the integration controller
        required: true

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: integration-repair
  cancel-in-progress: false

jobs:
  repair:
    if: vars.AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    outputs:
      published_head: ${{ steps.publish.outputs.published_head }}
    env:
      ELECTRON_SKIP_BINARY_DOWNLOAD: '1'
      GIT_EDITOR: 'true'
      INTEGRATION_RULESET_UPDATED_AT: ${{ vars.INTEGRATION_RULESET_UPDATED_AT }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0
      - name: Validate repair reservation
        id: validate
        uses: actions/github-script@v8
        with:
          script: |
            const number = Number(context.payload.inputs.pr_number);
            if (!Number.isSafeInteger(number) || number < 1) throw new Error('Invalid PR');
            const { data: pr } = await github.rest.pulls.get({ ...context.repo, pull_number: number });
            const labels = pr.labels.map(l => l.name);
            if (pr.state !== 'open' || pr.draft || pr.changed_files > 3000 || pr.base.ref !== 'main' ||
                pr.head.repo?.full_name !== `${context.repo.owner}/${context.repo.repo}` ||
                pr.head.sha !== context.payload.inputs.expected_head_sha ||
                !labels.includes('ready-to-merge') || !labels.includes('integration-repairing') ||
                labels.includes('integration-blocked')) throw new Error('Stale or ineligible repair');
            const { data: access } = await github.rest.repos.getCollaboratorPermissionLevel({
              ...context.repo, username: pr.user.login
            });
            if (!['admin', 'maintain', 'write'].includes(access.permission)) throw new Error('Untrusted author');
            const { validateProtection } = require('./.github/scripts/integration.cjs');
            await validateProtection(github, context.repo);
            core.setOutput('branch', pr.head.ref);
            core.setOutput('sha', pr.head.sha);
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
      - name: Prepare candidate
        env:
          TASK_BRANCH: ${{ steps.validate.outputs.branch }}
          TASK_SHA: ${{ steps.validate.outputs.sha }}
        shell: bash
        run: |
          git config core.hooksPath /dev/null
          git config user.name 'Dino integration bot'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git check-ref-format "refs/heads/$TASK_BRANCH"
          git fetch origin "refs/heads/$TASK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TASK_SHA"
          git checkout --detach "$TASK_SHA"
          git fetch origin main
          if ! git rebase origin/main; then
            test -n "$(git diff --name-only --diff-filter=U)"
          fi
      - name: Repair with Claude subscription
        uses: anthropics/claude-code-action@v1
        env:
          CLAUDE_BRANCH: ${{ steps.validate.outputs.branch }}
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          github_token: ${{ github.token }}
          allowed_bots: 'github-actions[bot]'
          additional_permissions: |
            actions: read
          claude_args: '--max-turns 25 --allowedTools "Bash(npm ci),Bash(npm test),Bash(git diff:*),Bash(git status:*),Bash(git add:*),Bash(git rebase --continue)"'
          prompt: |
            Repair PR #${{ inputs.pr_number }} on the already checked-out task branch.
            Read AGENTS.md and applicable package-info.md files. Read the PR description
            and both sides of the diff to understand the intended behavior. Resolve the
            pending rebase onto origin/main and/or the CI failure while preserving both
            tasks. Run npm ci and npm test. Never weaken or skip checks to make CI pass.
            Configuration and instruction files may be repaired when needed for this task.
            For each rebase conflict, edit the resolution, git add the resolved files, and
            run git rebase --continue (GIT_EDITOR=true). Repeat until the rebase is
            complete. Never git rebase --skip or discard another feature. Rebase
            continuation may recreate existing commits; do not create other commits,
            push, merge a PR, change labels or repository settings.
            Leave additional CI-fix edits uncommitted for the publishing step. If intent is
            ambiguous, leave the conflict unresolved and explain the blocker.
      - name: Validate and commit repaired candidate
        shell: bash
        run: |
          test ! -d "$(git rev-parse --git-path rebase-merge)"
          test ! -d "$(git rev-parse --git-path rebase-apply)"
          git add -A
          test -z "$(git diff --name-only --diff-filter=U)"
          git diff --check
          git diff --cached --check
          npm ci
          npm test
          node --test .github/scripts/integration.test.cjs .github/scripts/rebase.test.cjs .github/scripts/await-task-ci.test.cjs
          git add -A
          git diff --cached --check
          if ! git diff --cached --quiet; then
            git commit -m 'Repair failing checks after rebasing onto main'
          fi
      - name: Publish only the reserved task branch
        id: publish
        env:
          TASK_BRANCH: ${{ steps.validate.outputs.branch }}
          TASK_SHA: ${{ steps.validate.outputs.sha }}
        shell: bash
        run: |
          git check-ref-format "refs/heads/$TASK_BRANCH"
          git fetch origin "refs/heads/$TASK_BRANCH"
          test "$(git rev-parse FETCH_HEAD)" = "$TASK_SHA"
          git push --force-with-lease="refs/heads/$TASK_BRANCH:$TASK_SHA" origin "HEAD:refs/heads/$TASK_BRANCH"
          echo "published_head=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
      - name: Request independent candidate validation
        uses: actions/github-script@v8
        with:
          script: |
            try {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: Number(context.payload.inputs.pr_number), name: 'integration-rebase-conflict' });
            } catch (error) { if (error.status !== 404) throw error; }
            await github.rest.actions.createWorkflowDispatch({ ...context.repo, workflow_id: 'integration.yml', ref: 'main' });
      - name: Release reservation
        if: always()
        uses: actions/github-script@v8
        with:
          script: |
            const number = Number(context.payload.inputs.pr_number);
            if (!Number.isSafeInteger(number) || number < 1) return;
            try {
              await github.rest.issues.removeLabel({ ...context.repo, issue_number: number, name: 'integration-repairing' });
            } catch (error) { if (error.status !== 404) throw error; }
  await-ci:
    needs: repair
    if: needs.repair.result == 'success' && needs.repair.outputs.published_head != '' && vars.AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          TASK_PR: ${{ inputs.pr_number }}
          TASK_HEAD: ${{ needs.repair.outputs.published_head }}
        with:
          script: |
            const awaitCi = require('./.github/scripts/await-task-ci.cjs');
            await awaitCi({ github, context, core, prNumber: process.env.TASK_PR, expectedHead: process.env.TASK_HEAD });
