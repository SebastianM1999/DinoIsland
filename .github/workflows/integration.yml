name: Integration queue

on:
  pull_request_target:
    types: [labeled, ready_for_review]
    branches: [main]
  workflow_run:
    workflows: [CI]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

jobs:
  integrate:
    concurrency:
      group: integration-controller
      cancel-in-progress: false
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' &&
      (github.event_name != 'pull_request_target' || github.event.action == 'ready_for_review' || github.event.label.name == 'ready-to-merge') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDE_REPAIR_ENABLED: ${{ vars.CLAUDE_REPAIR_ENABLED }}
      INTEGRATION_RULESET_UPDATED_AT: ${{ vars.INTEGRATION_RULESET_UPDATED_AT }}
    outputs:
      pending_pr: ${{ steps.controller.outputs.pending_pr }}
      pending_head: ${{ steps.controller.outputs.pending_head }}
    steps:
      # Never check out or execute the PR here: this job has write permissions.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        id: controller
        with:
          script: |
            const integrate = require('./.github/scripts/integration.cjs');
            await integrate({ github, context, core });

  await-candidate-ci:
    needs: integrate
    if: needs.integrate.result == 'success' && needs.integrate.outputs.pending_pr != '' && vars.AUTOMERGE_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      pull-requests: read
      issues: write
      actions: write
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        env:
          TASK_PR: ${{ needs.integrate.outputs.pending_pr }}
          TASK_HEAD: ${{ needs.integrate.outputs.pending_head }}
        with:
          script: |
            const awaitCi = require('./.github/scripts/await-task-ci.cjs');
            await awaitCi({ github, context, core, prNumber: process.env.TASK_PR,
              expectedHead: process.env.TASK_HEAD, candidateOnly: true });
