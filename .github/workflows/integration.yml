name: Integration queue

on:
  pull_request_target:
    types: [labeled]
    branches: [main]
  workflow_run:
    workflows: [CI, Integration repair]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write
  checks: read

concurrency:
  group: integration-controller
  cancel-in-progress: false

jobs:
  integrate:
    if: >-
      vars.AUTOMERGE_ENABLED == 'true' &&
      (github.event_name != 'pull_request_target' || github.event.label.name == 'ready-to-merge') &&
      (github.event_name != 'workflow_run' || github.event.workflow_run.event != 'push')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      CLAUDE_REPAIR_ENABLED: ${{ vars.CLAUDE_REPAIR_ENABLED }}
      INTEGRATION_RULESET_UPDATED_AT: ${{ vars.INTEGRATION_RULESET_UPDATED_AT }}
    steps:
      # Never check out or execute the PR here: this job has write permissions.
      - uses: actions/checkout@v6
        with:
          ref: main
          persist-credentials: false
      - uses: actions/github-script@v8
        with:
          script: |
            const integrate = require('./.github/scripts/integration.cjs');
            await integrate({ github, context, core });
